<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c11">
<title>YOLOv8 Nesne Tespiti</title>
<!--
KURULUM
1) Modeli üret (bilgisayarda bir kez):
     pip install ultralytics
     yolo export model=yolov8n.pt format=onnx imgsz=320 opset=12
   Çıkan yolov8n.onnx dosyasını bu HTML ile AYNI klasöre koy.
   (Kendi insan/silah modelin varsa onu kullan; aşağıda CONFIG.CUSTOM_CLASSES'ı doldur.)
2) Kamera için sayfa HTTPS veya localhost üzerinden açılmalı (ör. GitHub Pages).
   Dosyayı doğrudan açarsan model otomatik okunamaz; sayfadaki "Model seç" ile .onnx'i seç.
3) Model bir kez yüklenince tarayıcıda (IndexedDB) saklanır, sonraki açılışlarda tekrar istenmez.
4) Tam çevrimdışı çalışma: ONNX Runtime dosyalarını (ort.min.js ve ort-wasm*.wasm) indirip
   "ort/" klasörüne koy; CDN'e ulaşılamazsa sayfa otomatik olarak oradan yükler.
-->
<style>
:root{
  --bg:#070c11; --glass:rgba(9,15,21,.74); --line:rgba(150,185,210,.18);
  --text:#e9f1f6; --mute:#8fa3b3; --green:#34f5a0; --red:#ff4757;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#cam,#ov{position:fixed;inset:0;width:100%;height:100%}
#cam{object-fit:cover;background:var(--bg)}
#ov{pointer-events:none}

/* Tarama animasyonu */
.scan{position:fixed;left:0;right:0;top:0;height:26vh;height:26dvh;pointer-events:none;display:none;
  background:linear-gradient(to bottom,rgba(52,245,160,0),rgba(52,245,160,.2));
  border-bottom:2px solid var(--green);box-shadow:0 8px 28px rgba(52,245,160,.5);
  transform:translateY(-100%);animation:sweep 2.8s cubic-bezier(.45,0,.55,1) infinite}
.scan.on{display:block}
@keyframes sweep{to{transform:translateY(100vh);transform:translateY(100dvh)}}
@media (prefers-reduced-motion:reduce){.scan.on{animation:none;display:none}}

.glass{background:var(--glass);border:1px solid var(--line);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.banner{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);
  max-width:calc(100% - 24px);padding:9px 16px;border-radius:999px;font-size:14px;font-weight:600;
  letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.hud{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding:12px 14px;border-radius:18px;display:grid;gap:10px}
.stats{display:flex;align-items:center;gap:18px;font-variant-numeric:tabular-nums}
.stat b{font-size:20px;font-weight:700}
.stat span{font-size:12px;color:var(--mute);margin-left:4px}
.stats .btn{margin-left:auto}
.conf{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--mute)}
.conf input{flex:1;accent-color:var(--green)}
.conf output{width:3ch;text-align:right;color:var(--text);font-variant-numeric:tabular-nums}

.btn{display:inline-block;padding:9px 14px;border-radius:12px;border:1px solid var(--line);
  background:rgba(52,245,160,.14);color:var(--green);font:600 13px system-ui,sans-serif;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text)}

.panel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);
  padding:22px;border-radius:20px;display:grid;gap:12px;text-align:left}
.panel[hidden]{display:none}
.panel h2{font-size:18px}
.panel p{font-size:14px;line-height:1.5;color:var(--mute)}
.panel .row{display:flex;flex-wrap:wrap;gap:8px}
</style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<canvas id="ov"></canvas>
<div class="scan" id="scan"></div>

<div class="banner glass" id="banner">🟡 Başlatılıyor…</div>

<section class="panel glass" id="panel" hidden>
  <h2 id="pTitle"></h2>
  <p id="pMsg"></p>
  <div class="row">
    <label class="btn" for="file" id="pickBtn">Model seç (.onnx)</label>
    <button class="btn ghost" id="retry">Kamerayı yeniden dene</button>
  </div>
</section>
<input id="file" type="file" accept=".onnx,application/octet-stream" hidden>

<section class="hud glass">
  <div class="stats">
    <div class="stat"><b id="fps">0</b><span>FPS</span></div>
    <div class="stat"><b id="ms">0</b><span>ms</span></div>
    <div class="stat"><b id="cnt">0</b><span>nesne</span></div>
    <label class="btn ghost" for="file">Model</label>
  </div>
  <div class="conf">Eşik
    <input id="conf" type="range" min="10" max="90" value="35">
    <output id="confV">35</output>%
  </div>
</section>

<script>
(() => {
'use strict';

/* ================== AYARLAR ================== */
const CONFIG = {
  MODEL_URL: './yolov8n.onnx',
  INPUT_CANDIDATES: [320, 416, 480, 512, 640], // modelin kabul ettiği boyut otomatik bulunur
  CONF: 0.35, IOU: 0.45, MAX_DET: 50,
  CUSTOM_CLASSES: [],                          // ör. ['insan','silah'] (kendi modelin için)
  DANGER: ['knife','scissors','gun','pistol','rifle','weapon','firearm','handgun','silah','bıçak','tabanca'],
};
const ORT_SOURCES = [
  { js:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/ort.min.js',
    wasm:'https://cdn.jsdelivr.net/npm/onnxruntime-web@1.17.3/dist/' },
  { js:'./ort/ort.min.js', wasm:'./ort/' },       // çevrimdışı yedek
];
const COCO = ['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush'];

/* ================== DURUM ================== */
const $ = s => document.querySelector(s);
const video = $('#cam'), cv = $('#ov'), ctx = cv.getContext('2d');
let session = null, inputName = '', outputName = '';
let S = 320, nc = 80, layout = 'cf', names = COCO, off, octx, input;
let stream = null, running = false;

/* ================== ARAYÜZ ================== */
const TEXT = { load:'🟡 Model yükleniyor…', wait:'⚪ Model bekleniyor',
  active:'🟢 YOLOv8 Yapay Zeka Taraması Aktif', err:'🔴 Hata' };
function setStatus(k, custom){
  $('#banner').textContent = custom || TEXT[k];
  $('#scan').classList.toggle('on', k === 'active');
}
function showPanel(title, msg, {model=false, camera=false} = {}){
  $('#pTitle').textContent = title; $('#pMsg').textContent = msg;
  $('#pickBtn').style.display = model ? '' : 'none';
  $('#retry').style.display = camera ? '' : 'none';
  $('#panel').hidden = false;
}
const hidePanel = () => { $('#panel').hidden = true; };
function resize(){
  const d = devicePixelRatio || 1;
  cv.width = Math.round(cv.clientWidth * d); cv.height = Math.round(cv.clientHeight * d);
  ctx.setTransform(d, 0, 0, d, 0, 0);
}
function refresh(){ if (session && stream) { hidePanel(); setStatus('active'); loop(); } }

/* ================== ONNX RUNTIME ================== */
function loadScript(src){
  return new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = ok; s.onerror = () => fail(new Error('Yüklenemedi: ' + src));
    document.head.appendChild(s);
  });
}
async function ensureOrt(){
  if (window.ort) return;
  for (const src of ORT_SOURCES){
    try { await loadScript(src.js); ort.env.wasm.wasmPaths = src.wasm; break; } catch(e){}
  }
  if (!window.ort) throw new Error('ONNX Runtime Web yüklenemedi. İnternet bağlantısını kontrol et veya ort/ klasörünü ekle.');
  ort.env.wasm.numThreads = self.crossOriginIsolated ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
}

/* ================== MODEL (IndexedDB önbellekli) ================== */
const DB = {
  open: () => new Promise((ok, fail) => {
    const r = indexedDB.open('yolo-cache', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => ok(r.result); r.onerror = () => fail(r.error);
  }),
  async get(k){ const db = await this.open();
    return new Promise((ok, fail) => { const q = db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => ok(q.result); q.onerror = () => fail(q.error); }); },
  async set(k, v){ const db = await this.open();
    return new Promise((ok, fail) => { const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(v, k); t.oncomplete = ok; t.onerror = () => fail(t.error); }); },
};

async function probe(){
  let lastErr;
  for (const s of CONFIG.INPUT_CANDIDATES){
    try {
      const t = new ort.Tensor('float32', new Float32Array(3 * s * s), [1, 3, s, s]);
      const out = (await session.run({ [inputName]: t }))[outputName];
      return { s, dims: out.dims };
    } catch(e){ lastErr = e; }
  }
  throw lastErr;
}

async function startSession(buf, label, persist){
  setStatus('load');
  try {
    await ensureOrt();
    session = await ort.InferenceSession.create(new Uint8Array(buf),
      { executionProviders: ['wasm'], graphOptimizationLevel: 'all' });
    inputName = session.inputNames[0]; outputName = session.outputNames[0];
    const { s, dims } = await probe();           // aynı zamanda ısınma çalıştırması
    S = s;
    layout = dims[1] < dims[2] ? 'cf' : 'rows';  // [1,4+nc,N] veya [1,N,4+nc]
    nc = (layout === 'cf' ? dims[1] : dims[2]) - 4;
    names = CONFIG.CUSTOM_CLASSES.length === nc ? CONFIG.CUSTOM_CLASSES
          : nc === 80 ? COCO : Array.from({ length: nc }, (_, i) => 'sınıf ' + i);
    off = document.createElement('canvas'); off.width = off.height = S;
    octx = off.getContext('2d', { willReadFrequently: true });
    input = new Float32Array(3 * S * S);
    if (persist) DB.set('model', { name: label, buf }).catch(() => {});
    if (stream) refresh(); else setStatus('wait', '⚪ Kamera bekleniyor');
  } catch(e){
    session = null; console.error(e);
    setStatus('err', '🔴 Model açılamadı');
    showPanel('Model açılamadı', e.message || String(e), { model: true });
  }
}

async function initModel(){
  setStatus('load');
  let buf = null, label = '', persist = false;
  try { const c = await DB.get('model'); if (c) { buf = c.buf; label = c.name; } } catch(e){}
  if (!buf){
    try { const r = await fetch(CONFIG.MODEL_URL);
      if (r.ok){ buf = await r.arrayBuffer(); label = CONFIG.MODEL_URL; persist = true; } } catch(e){}
  }
  if (!buf){
    setStatus('wait');
    showPanel('Model dosyası gerekli', 'yolov8n.onnx dosyasını seç. Bir kez seçince bu cihazda saklanır.', { model: true });
    return;
  }
  startSession(buf, label, persist);
}

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  running = false; hidePanel();
  await startSession(await f.arrayBuffer(), f.name, true);
  e.target.value = '';
});

/* ================== KAMERA ================== */
async function startCamera(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    showPanel('Kamera kullanılamıyor', 'Sayfayı HTTPS veya localhost üzerinden aç.', { camera: true });
    setStatus('err', '🔴 Kamera yok'); return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
    video.srcObject = stream; await video.play();
    if (session) refresh(); else if ($('#panel').hidden) setStatus('load');
  } catch(e){
    const msg = e.name === 'NotAllowedError' ? 'Kamera izni verilmedi. Tarayıcı ayarlarından izin ver.'
      : e.name === 'NotFoundError' ? 'Kamera bulunamadı.' : 'Kamera açılamadı: ' + e.message;
    showPanel('Kamera açılamadı', msg, { camera: true, model: !session });
    setStatus('err', '🔴 Kamera hatası');
  }
}
$('#retry').addEventListener('click', () => { hidePanel(); startCamera(); });

/* ================== TESPİT ================== */
const iou = (a, b) => {
  const w = Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1), h = Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1);
  if (w <= 0 || h <= 0) return 0;
  const i = w * h; return i / ((a.x2 - a.x1) * (a.y2 - a.y1) + (b.x2 - b.x1) * (b.y2 - b.y1) - i);
};

async function detect(){
  const vw = video.videoWidth, vh = video.videoHeight, k = Math.min(S / vw, S / vh);
  const nw = Math.round(vw * k), nh = Math.round(vh * k);
  const px = Math.floor((S - nw) / 2), py = Math.floor((S - nh) / 2);
  octx.fillStyle = '#727272'; octx.fillRect(0, 0, S, S);   // letterbox
  octx.drawImage(video, 0, 0, vw, vh, px, py, nw, nh);
  const data = octx.getImageData(0, 0, S, S).data, area = S * S;
  for (let i = 0, p = 0; i < area; i++, p += 4){
    input[i] = data[p] / 255; input[i + area] = data[p + 1] / 255; input[i + 2 * area] = data[p + 2] / 255;
  }
  const out = (await session.run({ [inputName]: new ort.Tensor('float32', input, [1, 3, S, S]) }))[outputName];
  const d = out.data, N = layout === 'cf' ? out.dims[2] : out.dims[1], W = 4 + nc, cand = [];
  for (let i = 0; i < N; i++){
    let best = -1, bs = 0;
    for (let c = 0; c < nc; c++){
      const s = layout === 'cf' ? d[(4 + c) * N + i] : d[i * W + 4 + c];
      if (s > bs){ bs = s; best = c; }
    }
    if (bs < CONFIG.CONF) continue;
    let cx, cy, w, h;
    if (layout === 'cf'){ cx = d[i]; cy = d[N + i]; w = d[2 * N + i]; h = d[3 * N + i]; }
    else { const o = i * W; cx = d[o]; cy = d[o + 1]; w = d[o + 2]; h = d[o + 3]; }
    cand.push({ x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2, score: bs, cls: best });
  }
  cand.sort((a, b) => b.score - a.score);
  const keep = [];
  for (const c of cand){                                   // sınıf bazlı NMS
    if (keep.every(q => q.cls !== c.cls || iou(q, c) <= CONFIG.IOU)) keep.push(c);
    if (keep.length >= CONFIG.MAX_DET) break;
  }
  const sx = nw / vw, sy = nh / vh, cl = (v, m) => Math.max(0, Math.min(m, v));
  return keep.map(b => ({ cls: b.cls, score: b.score,
    x1: cl((b.x1 - px) / sx, vw), y1: cl((b.y1 - py) / sy, vh),
    x2: cl((b.x2 - px) / sx, vw), y2: cl((b.y2 - py) / sy, vh) }));
}

/* ================== ÇİZİM ================== */
function draw(dets){
  const cw = cv.clientWidth, ch = cv.clientHeight, vw = video.videoWidth, vh = video.videoHeight;
  const k = Math.max(cw / vw, ch / vh), ox = (cw - vw * k) / 2, oy = (ch - vh * k) / 2; // object-fit: cover
  ctx.clearRect(0, 0, cw, ch);
  ctx.lineJoin = 'round'; ctx.font = '600 13px system-ui,sans-serif';
  for (const d of dets){
    const name = names[d.cls], danger = CONFIG.DANGER.includes(String(name).toLowerCase());
    const col = danger ? '#ff4757' : '#34f5a0';
    const x = d.x1 * k + ox, y = d.y1 * k + oy, w = (d.x2 - d.x1) * k, h = (d.y2 - d.y1) * k;
    if (danger){ ctx.fillStyle = 'rgba(255,71,87,.14)'; ctx.fillRect(x, y, w, h); }
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
    const label = name + ' ' + Math.round(d.score * 100) + '%', tw = ctx.measureText(label).width + 12;
    const ly = y >= 22 ? y - 22 : y;
    ctx.fillStyle = col; ctx.fillRect(x, ly, tw, 22);
    ctx.fillStyle = danger ? '#fff' : '#04140c'; ctx.fillText(label, x + 6, ly + 15);
  }
}

let fps = 0, lastUi = 0;
async function loop(){
  if (running) return; running = true;
  while (running){
    if (session && video.readyState >= 2 && !document.hidden){
      try {
        const t0 = performance.now(), dets = await detect(), dt = performance.now() - t0;
        draw(dets);
        fps = fps ? fps * .8 + (1000 / dt) * .2 : 1000 / dt;
        if (t0 - lastUi > 400){ lastUi = t0;
          $('#fps').textContent = fps.toFixed(0); $('#ms').textContent = dt.toFixed(0); $('#cnt').textContent = dets.length; }
      } catch(e){
        console.error(e); running = false; setStatus('err', '🔴 Çıkarım hatası'); return;
      }
    }
    await new Promise(requestAnimationFrame);
  }
}

/* ================== BAŞLAT ================== */
$('#conf').addEventListener('input', e => {
  CONFIG.CONF = e.target.value / 100; $('#confV').textContent = e.target.value;
});
addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 300));
addEventListener('pagehide', () => stream && stream.getTracks().forEach(t => t.stop()));
resize(); ensureOrt().catch(() => {}); startCamera(); initModel();
})();
</script>
</body>
</html>
